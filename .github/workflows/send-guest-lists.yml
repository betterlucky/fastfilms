name: Send Guest Lists

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  send-guest-lists:
    runs-on: ubuntu-latest
    steps:
      - name: Send Guest Lists
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -x
          set -e
          response=$(curl -s -w "\n%{http_code}" -X GET "https://fastfilms.vercel.app/api/cron/send-guest-lists" -H "Authorization: Bearer $CRON_SECRET")
          body=$(echo "$response" | head -n -1)
          status_code=$(echo "$response" | tail -n 1)
          echo "Response body: $body"
          echo "Status code: $status_code"
          
          if [ "$status_code" -eq 200 ]; then
            # Check if no guest lists were needed
            if echo "$body" | grep -q '"guestListsSent":0'; then
              echo "✅ No guest lists needed to be sent today"
            else
              echo "✅ Guest lists processed successfully"
              echo "$body"
            fi
            exit 0
          elif [ "$status_code" -eq 204 ]; then
            echo "✅ No guest lists needed to be sent today"
            exit 0
          else
            echo "❌ Error: Failed to send guest lists"
            echo "Status code: $status_code"
            echo "Response: $body"
            exit 1
          fi