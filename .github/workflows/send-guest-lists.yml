name: Send Guest Lists

on:
  schedule:
    # Run at 6 AM UTC every day
    - cron: '0 6 * * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  send-guest-lists:
    runs-on: ubuntu-latest
    steps:
      - name: Send Guest Lists
        shell: bash
        run: |
          # Enable debugging
          set -x
          
          # Make the script fail on any error
          set -e
          
          # Send the request and capture both response and status code
          response=$(curl -s -w "\n%{http_code}" -X GET "https://fastfilms.vercel.app/api/cron/send-guest-lists" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          
          # Split response into body and status code
          body=$(echo "$response" | head -n -1)
          status_code=$(echo "$response" | tail -n 1)
          
          # Log the response for debugging
          echo "Response body: $body"
          echo "Status code: $status_code"
          
          if [ "$status_code" -eq 200 ]; then
            echo "✅ Guest lists processed successfully"
            echo "$body"
            exit 0
          elif [ "$status_code" -eq 204 ]; then
            echo "✅ No guest lists needed to be sent today"
            exit 0
          else
            echo "❌ Error: Failed to send guest lists"
            echo "Status code: $status_code"
            echo "Response: $body"
            exit 1
          fi